// ================= 비활성화 고객 =================
// 선택한 달 기준 최근 3개월 합계로 분류합니다.
function InactiveTab(p){
  var zh=(UI_LANG==='zh');
  var _a=useState('zero'); var seg=_a[0], setSeg=_a[1];
  var base=p.pm;                 // 기준달 (1~NM)
  var lo=Math.max(0, base-3);    // 최근 3개월 시작 인덱스

  var calc=useMemo(function(){
    return p.rows.map(function(r){
      var t3=0, sys3=[]; for(var j=0;j<NS;j++) sys3.push(0);
      for(var i=lo;i<base;i++){
        for(var j=0;j<NS;j++){ var v=(r.s&&r.s[i]&&r.s[i][j])||0; t3+=v; sys3[j]+=v; }
      }
      var tot=0; for(var i=0;i<base;i++) tot+=(r.m[i]||0);
      // t3 = 최근 3개월 판매수 (분류 기준), cum = 1月~기준달 누계 (참고용)
      return Object.assign({},r,{t3:t3, sys3:sys3, cum:tot, _hl:r.dec===1});
    });
  },[p.rows,base,lo]);

  var groups=useMemo(function(){
    return {
      low:  calc.filter(function(x){ return x.t3>0 && x.t3<=5; }).sort(function(a,b){ return a.t3-b.t3 || b.cum-a.cum; }),
      zero: calc.filter(function(x){ return x.t3===0; }).sort(function(a,b){ return b.cum-a.cum; }),
      act:  calc.filter(function(x){ return x.t3>5; }).sort(function(a,b){ return b.t3-a.t3; })
    };
  },[calc]);

  var cur=groups[seg]||[];
  var months=[]; for(var i=lo;i<base;i++) months.push(MON[i]);
  var span=months.join('·');
  // 각 고객의 최근3개월 상태(현재↔비활성 연결 고리): 정상/소량/이탈/미개시
  function stOf(r){ if(r.t3>5) return 'ok'; if(r.t3>0) return 'lo'; return r.cum>0?'ch':'nv'; }
  var STLB={ok:['정상','正常'],lo:['소량','少量'],ch:['이탈','流失'],nv:['미개시','未开始']};
  // 전환 흐름 카운트 (현재 고객 → 비활성 연결)
  var flowAll=calc.length;
  var flowOk=calc.filter(function(x){return x.t3>5;}).length;
  var flowLo=calc.filter(function(x){return x.t3>0&&x.t3<=5;}).length;
  var flowCh=calc.filter(function(x){return x.t3===0&&x.cum>0;}).length;
  var flowNv=calc.filter(function(x){return x.t3===0&&x.cum===0;}).length;
  // 목록 정렬(헤더 클릭) — 현재 고객목록과 동일 UX
  var _ls=useState({k:'t3',d:1}); var lsort=_ls[0], setLsort=_ls[1];
  function onLSort(k){ setLsort(lsort.k===k?{k:k,d:-lsort.d}:{k:k,d:(k==='name'||k==='dealer'||k==='type'?1:-1)}); }
  var curS=cur.slice().sort(function(a,b){ var k=lsort.k,d=lsort.d,xa=a[k],ya=b[k];
    if(k==='name'||k==='dealer'||k==='type') return String(xa||'').localeCompare(String(ya||''),'zh')*d;
    return ((xa||0)-(ya||0))*d; });

  // 전체(분모) 대비 현재 구간 비율까지 계산합니다.
  function by(key){
    var all={}, sel={};
    calc.forEach(function(r){ var k=r[key]||'(미지정)'; (all[k]=all[k]||[]).push(r); });
    cur.forEach(function(r){ var k=r[key]||'(미지정)'; (sel[k]=sel[k]||[]).push(r); });
    return Object.keys(all).map(function(k){
      var A=all[k], S=sel[k]||[];
      var buy=A.filter(function(x){ return x.t3>0; }).length;
      return {key:k, tot:A.length, n:S.length, buy:buy,
        rate: A.length? buy/A.length*100 : 0,
        t3:S.reduce(function(a,x){return a+x.t3;},0),
        share: A.length? S.length/A.length*100 : 0};
    }).filter(function(x){ return x.n>0; }).sort(function(a,b){ return b.n-a.n; });
  }
  var byProv=useMemo(function(){ return by('prov'); },[cur,calc]);
  var byMgr=useMemo(function(){ return by('mgr'); },[cur,calc]);
  var byDeal=useMemo(function(){ return by('dealer'); },[cur,calc]);

  var SEG=[['zero','3개월 미구매',groups.zero.length],['low','3개월 5개 이하',groups.low.length],['act','정상 구매',groups.act.length]];

  var SEGN={zero:'3개월 미구매', low:'5개 이하', act:'정상'};
  var gcols=function(lab){ return [
    {t:lab,k:'key',w:'170px',r:function(r){ return h('b',{className:'zh dk'},r.key); }},
    {t:'전체 고객수',k:'tot',num:1,r:function(r){ return nf(r.tot); }},
    {t:'거래 고객',k:'buy',num:1,r:function(r){ return nf(r.buy); }},
    {t:'실구매율',k:'rate',num:1,r:function(r){
      return h('span',{className:r.rate<50?'bad':(r.rate>=75?'good':'')},pf(r.rate)); }},
    {t:SEGN[seg]||'해당',k:'n',num:1,r:function(r){ return h('b',{className:seg==='zero'?'bad':''},nf(r.n)); }},
    {t:'비중',k:'share',num:1,r:function(r){ return pf(r.share); }},
    {t:'3개월 판매',k:'t3',num:1,r:function(r){ return r.t3? nf(r.t3) : h('span',{className:'dim'},'0'); }}
  ]; };

  var ccols=[
    {t:'고객명',k:'name',w:'180px',r:function(r){ var st=stOf(r); return h('div',null,
      h('b',{className:'zh'},r.name),
      h('span',{className:'st-tag '+st}, STLB[st][zh?1:0]),
      h('div',{className:'sm2 zh'}, r.prov+' · '+r.mgr,
        r.dec?h('span',{className:'tag dec'},'하락'):null,
        r.bd?h('span',{className:'tag bd'},'BD'):null)); },
     edit:{type:'text', get:function(r){return r.name;}, set:function(r,v){ p.onEdit(r.id,'name',v); }}},
    {t:'대리상',k:'dealer',w:'150px',r:function(r){ return h('span',{className:r.dealer?'zh dk':'dim'}, r.dealer||'(미배정)'); },
     edit:{type:'text', list:'dl-dealer', get:function(r){return r.dealer||'';}, set:function(r,v){ p.onEdit(r.id,'dealer',v||null); }}},
    {t:'유형',k:'type',r:function(r){ return h('span',{className:'zh'},r.type||'-'); },
     edit:{type:'sel', opts:[''].concat(p.types), get:function(r){return r.type||'';}, set:function(r,v){ p.onEdit(r.id,'type',v||null); }}},
    {t:'3개월 판매',k:'t3',num:1,r:function(r){ return r.t3? h('b',null,nf(r.t3)) : h('span',{className:'dim'},'0'); }},
    {t:'1~'+base+'月 누계',k:'cum',num:1,r:function(r){ return h('span',{className:'dim'},nf(r.cum)); }},
    {t:'방문',k:'v',num:1,r:function(r){ return r.v? nf(r.v) : h('span',{className:'dim'},'0'); },
     edit:{type:'num', get:function(r){return r.v||0;}, set:function(r,v){ p.onEdit(r.id,'v',v); }}}
  ];

  var C=p.C;
  var flowNode=function(cls,lab,val,sub,segKey){ return h('div',{className:'flow-n'+(cls?(' '+cls):'')+(segKey?' flow-clk':''),
    onClick:segKey?function(){ setSeg(segKey); }:null},
    h('div',{className:'fl'},lab), h('div',{className:'fv'},nf(val)), sub?h('div',{className:'fs'},sub):null); };
  return h('div',null,
    h(Card,Object.assign({title:zh?'转化流(现有客户 → 停滞连接)':'전환 흐름 (현재 고객목록 → 비활성화 연결 고리)',
      note:zh?'现有客户如何流向停滞 · 点方块联动下方列表':'현재 고객이 어떻게 비활성으로 흐르는지 · 박스 클릭 시 아래 목록 연동',wide:true},C('in_flow')),
      h(ProvBar,{provs:p.provs,cur:p.prov,onPick:p.onProv,counts:p.counts,label:'지역',tight:true}),
      h('div',{className:'flow'},
        flowNode('', zh?'전체 고객':'전체 고객', flowAll, zh?'현재 고객목록 전체':'현재 고객목록 전체', null),
        h('div',{className:'flow-a'},'→'),
        flowNode('ok', zh?'正常购买':'정상 구매', flowOk, '>5 · '+span, 'act'),
        h('div',{className:'flow-a'},'→'),
        flowNode('', zh?'少量(5个以下)':'소량 (5개 이하)', flowLo, '1~5 · '+span, 'low'),
        h('div',{className:'flow-a'},'→'),
        flowNode('risk', zh?'流失(曾购停止)':'이탈 (구매하다 중단)', flowCh, zh?'3个月0':'3개월 0', 'zero'),
        h('div',{className:'flow-a'},'+'),
        flowNode('risk', zh?'未开始':'미개시 (거래 없음)', flowNv, zh?'累计0':'누계 0', 'zero')),
      h('div',{className:'ed-n',style:{marginTop:'6px'}}, zh?'※ 「이탈」은 과거 거래가 있었으나 최근 3개월 판매 0 — 재접촉 우선순위. 「미개시」는 누적 거래가 전혀 없는 고객입니다.'
        :'※ 「이탈」은 과거 거래가 있었으나 최근 3개월 판매 0 — 재접촉 우선순위. 「미개시」는 누적 거래가 전혀 없는 고객입니다.')),
    h('div',{className:'segs'},
      h('span',{className:'plb'},'기준 '+MON[base-1]+' · 최근 3개월 ('+span+')'),
      h('div',{className:'segb'}, SEG.map(function(x){
        return h('button',{key:x[0],className:'sg'+(seg===x[0]?' on':''),onClick:function(){ setSeg(x[0]); }},
          x[1], h('b',null,' '+nf(x[2])));
      }))),
    h('div',{className:'lay'},
      h(Card,Object.assign({title:'지역별',note:'자동 집계'},C('in_prov')),
        h('div',{className:'agg-n'},'※ 아래 목록에서 개별 고객을 수정하세요.'),
        h(Table,{cols:gcols('지역'),rows:byProv})),

      h(Card,Object.assign({title:'대리상별',note:byDeal.length+'개사',wide:true},C('in_deal')),
        h(Table,{cols:gcols('대리상'),rows:byDeal})),

          : h('div',{className:'empty'},'해당하는 고객이 없습니다.'),
        cur.length>300? h('div',{className:'ed-n'},'※ 300곳까지 표시합니다.'):null),
      h('datalist',{id:'dl-dealer'},p.dealers.map(function(x){ return h('option',{key:x,value:x}); }))
    )
  );
}

// ================= 비활성화 고객 전용 KPI =================
function InactKpi(p){
  var base=p.pm, lo=Math.max(0,base-3);
  var span=MON[lo]+'~'+MON[base-1];
  var K=useMemo(function(){
    var n=p.rows.length, no=0, low=0, act=0, t3sum=0, cum=0, noVisit=0, lost=0;
    p.rows.forEach(function(r){
      var t=0; for(var i=lo;i<base;i++) t+=(r.m[i]||0);
      var c=0; for(var i=0;i<base;i++) c+=(r.m[i]||0);
      t3sum+=t; cum+=c;
      if(t===0){ no++; if(!r.v) noVisit++; if(c>0) lost++; }
      else if(t<=5) low++;
      else act++;
    });
    return {n:n, no:no, low:low, act:act, t3:t3sum, cum:cum, noVisit:noVisit, lost:lost,
      rate: n? act/n*100 : 0};
  },[p.rows,base,lo]);

  return h('div',null,
    h('div',{className:'kpis kpis-5'},
      h(KPI,{label:'전체 고객',value:nf(K.n),unit:'개소',sub:'현재 필터 기준'}),
      h(KPI,{label:'3개월 미구매',value:nf(K.no),unit:'개소',warn:K.no>0,
        sub:span+' 구매 0 ('+pf(K.n? K.no/K.n*100:0)+')'}),
      h(KPI,{label:'거래 끊김',value:nf(K.lost),unit:'개소',warn:K.lost>0,
        sub:'과거 구매 있었으나 최근 0'}),
      h(KPI,{label:'방문 기록 0',value:nf(K.noVisit),unit:'개소',warn:K.noVisit>0,
        sub:'미구매 중 미접촉'}),
      h(KPI,{label:'소량 구매',value:nf(K.low),unit:'개소',
        sub:'3개월 5개 이하'}),
      h(KPI,{label:'정상 구매',value:nf(K.act),unit:'개소',hero:1,
        sub:pf(K.rate)+' · 3개월 5개 초과'})
    ),
    h('div',{className:'note-w'},
      '※ '+span+' 3개월 기준입니다. 「거래 끊김」은 과거엔 구매했으나 최근 3개월간 0인 고객으로, 가장 시급한 관리 대상입니다.')
  );
}

/* ===== ISO 주차 유틸 (연도/월/주 기간바) ===== */
function isoWeekSem(dt){ var d=new Date(Date.UTC(dt.getFullYear(),dt.getMonth(),dt.getDate())); var day=d.getUTCDay()||7; d.setUTCDate(d.getUTCDate()+4-day);
  var ys=new Date(Date.UTC(d.getUTCFullYear(),0,1)); var wn=Math.ceil((((d-ys)/86400000)+1)/7); return {year:d.getUTCFullYear(), week:wn}; }
function mondayOfWeekSem(year, week){ var simple=new Date(Date.UTC(year,0,1+(week-1)*7)); var dow=simple.getUTCDay();
  var mon=new Date(simple); if(dow<=4) mon.setUTCDate(simple.getUTCDate()-simple.getUTCDay()+1); else mon.setUTCDate(simple.getUTCDate()+8-simple.getUTCDay()); return mon; }
function weeksOfMonthSem(year, mo){ var seen={}, out=[], last=new Date(year, mo, 0).getDate();
  for(var d=1; d<=last; d++){ var iw=isoWeekSem(new Date(year, mo-1, d)); var key=iw.year+'-'+iw.week;
    if(!seen[key]){ seen[key]=1; var mon=mondayOfWeekSem(iw.year, iw.week); out.push({year:iw.year, week:iw.week, sub:(mon.getUTCMonth()+1)+'/'+mon.getUTCDate()}); } }
  return out; }

  function group(key){
    var m={};

    return Object.keys(m).map(function(k){
      var a=agg(m[k]); a.key=k;
      // 그룹 내 실적이 가장 큰 대리상 (담당자 옆에 표기)
      var dm={};
      m[k].forEach(function(r){

        dm[r.dealer]=(dm[r.dealer]||0)+sum(r.m);
      });

      var list=Object.keys(dm).sort(function(x,y){ return dm[y]-dm[x]; });
      a.dealer = list.length? list.join('\n') : null;
      a.dealerList = list;
      return a;
    }).sort(function(x,y){ return y.total-x.total; });

        var nm=calcNM(res.rows);

        // 엑셀을 올리면 그 시점을 자동으로 기록합니다 (버튼 불필요)
        var k=isoWeekOf(new Date());

        var ns=(db.snaps||[]).filter(function(x){ return !(x.y===k.y&&x.w===k.w); }).concat([snap]);
        setDb(function(pv){ return Object.assign({},pv,{snaps:sortSnaps(ns)}); });

      }catch(err){ setMsg({t:'err',m:'파일을 읽지 못했습니다: '+err.message}); }
    };

  function saveSnap(){
    var k=isoWeekOf(new Date());
    var inp=prompt('저장할 주차를 확인하세요 (ISO 주차)\n형식: 연도-주차  예) '+k.y+'-'+k.w, k.y+'-'+k.w);
    if(inp===null) return;
    var mm=String(inp).match(/(\d{4})\D+(\d{1,2})/);
    if(!mm){ setMsg({t:'err',m:'형식이 올바르지 않습니다. 예) 2026-29'}); return; }
    var y=+mm[1], w=+mm[2];
    if(w<1||w>weeksInIsoYear(y)){ setMsg({t:'err',m:y+'년은 W1~W'+weeksInIsoYear(y)+'까지입니다.'}); return; }
    var st=isoWeekStart(y,w);
    // 이 주가 속한 달 = 주 시작일 기준 (월말 걸침 주는 시작 달로 귀속)
    var mo=st.getUTCMonth()+1;
    var s=makeSnap(rows,y,w, st.toISOString().slice(0,10), mo);
    var ex=(db.snaps||[]).some(function(x){ return x.y===y&&x.w===w; });
    if(ex && !confirm(y+'-'+wLabel(w)+' 스냅샷이 이미 있습니다. 덮어쓸까요?')) return;
    var ns=(db.snaps||[]).filter(function(x){ return !(x.y===y&&x.w===w); }).concat([s]);
    setDb(Object.assign({},db,{snaps:sortSnaps(ns)}));
    setPy(y); setPm(st.getUTCMonth()+1);
    setMsg({t:'ok',m:y+'-'+wLabel(w)+' 스냅샷을 저장했습니다.'});
  }

      tab==='sem'? h(SeminarTab,{edu:semEdu,setEdu:setSemEdu,meet:semMeet,setMeet:setSemMeet,fu:semFu,setFu:setSemFu,lang:lang}):null,
      tab==='price'? h(PriceTab,{data:priceData,setData:setPriceData,C:C,lang:lang,locked:!!pick}):null
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
